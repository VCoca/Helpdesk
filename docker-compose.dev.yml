# Development: PostgreSQL only.

services:
  db:
    image: postgres:18-alpine
    container_name: helpdesk-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - helpdesk-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpdesk} -d ${POSTGRES_DB:-helpdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  helpdesk-pgdata:
